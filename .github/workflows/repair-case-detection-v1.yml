name: RepairCase Detection v1

on:
  push:
    paths:
      - "data/processed/ai/1405/**"
      - "automation/python/repair_case_detection_v1.py"
      - ".github/workflows/repair-case-detection-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-case-v1
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run RepairCase Detection v1
        run: python automation/python/repair_case_detection_v1.py

      - name: Commit outputs when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/repair_cases/v1
          if git diff --cached --quiet; then
            echo "No RepairCase output changes."
            exit 0
          fi
          git commit -m "Build RepairCase detection v1"
          git push
